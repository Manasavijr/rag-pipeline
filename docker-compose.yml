version: "3.9"

services:
  # ── Ollama — local LLM server ────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rag-net

  # ── Model puller — pulls llama3.2 on first run ───────────────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "llama3.2"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - rag-net
    restart: "no"

  # ── RAG API ──────────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: rag-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEBUG=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - FAISS_INDEX_PATH=/app/data/indexes/faiss_index
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - FAISS_TOP_K=5
    volumes:
      - ./data:/app/data     # persist indexes and raw docs
      - ./app:/app/app       # hot reload in dev
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - rag-net
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  rag-net:
    driver: bridge
