name: CI/CD — RAG Pipeline — Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: rag-pipeline
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/rag-pipeline

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short --asyncio-mode=auto
        env:
          DEBUG: "true"
          OLLAMA_BASE_URL: "http://localhost:11434"

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && secrets.GCP_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && secrets.GCP_PROJECT_ID != ''
    environment: production
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE }}:latest
          region: ${{ env.REGION }}
          flags: |
            --memory=4Gi
            --cpu=2
            --min-instances=0
            --max-instances=5
            --timeout=600
            --allow-unauthenticated
            --cpu-boost
          env_vars: |
            OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
            OLLAMA_MODEL=llama3.2
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
      - name: Smoke test
        run: |
          curl -f "${{ steps.deploy.outputs.url }}/health/live"
          echo "Deployed to ${{ steps.deploy.outputs.url }}"
